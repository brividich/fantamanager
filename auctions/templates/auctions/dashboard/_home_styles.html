<style>
    /* ═══════════════════════════════════════════════════════════
       HOME COMMAND CENTER STYLES (STANDALONE SUITE)
       ═══════════════════════════════════════════════════════════ */
    .fm-home-container {
        display: flex;
        flex-direction: column;
        gap: 28px;
        max-width: 1440px;
        margin: 0 auto 40px;
    }

    /* Topbar Enhancements */
    .fm-brand-badge {
        font-size: 9.5px;
        font-weight: 900;
        letter-spacing: .08em;
        padding: 2px 6px;
        border-radius: 4px;
        background: linear-gradient(135deg, #087cf0, #00d2ff);
        color: #fff;
        margin-left: 6px;
        box-shadow: 0 0 10px rgba(0, 210, 255, .4);
    }

    .fm-cmd-trigger {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(3, 15, 32, .7);
        border: 1px solid var(--fm-border);
        color: var(--fm-text-secondary);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all .15s;
    }

    .fm-cmd-trigger:hover {
        border-color: var(--fm-border-active);
        color: #fff;
        background: rgba(8, 124, 240, .12);
    }

    .fm-cmd-trigger .ic {
        width: 14px;
        height: 14px;
    }

    .fm-cmd-trigger kbd {
        font-family: var(--fm-display);
        font-size: 11px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, .08);
        border: 1px solid var(--fm-border);
        color: var(--fm-text-muted);
    }

    /* ═══════════════════════════════════════════════════════════
       GESTIONALE SPORTIVO — COMPACT DASHBOARD STYLES
       ═══════════════════════════════════════════════════════════ */
    .fm-sport-container {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 1440px;
        margin: 0 auto 30px;
    }

    /* 1. Executive Sports Header Bar */
    .fm-sport-header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: linear-gradient(135deg, rgba(8, 124, 240, .12) 0%, rgba(7, 29, 56, .85) 60%, rgba(4, 20, 41, .92) 100%);
        border: 1px solid var(--fm-border);
        border-radius: var(--fm-radius-md);
        padding: 14px 20px;
        flex-wrap: wrap;
    }

    .fm-sport-header-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .fm-sport-badge-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .fm-sport-title {
        font-family: var(--fm-display);
        font-weight: 800;
        font-size: clamp(22px, 2.4vw, 30px);
        letter-spacing: .02em;
        color: #fff;
        margin: 2px 0 0;
        line-height: 1.1;
    }

    .fm-sport-desc {
        font-size: 13px;
        color: var(--fm-text-secondary);
        margin: 0;
    }

    .fm-sport-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    /* Badge Pills */
    .fm-badge-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(3, 15, 32, .75);
        border: 1px solid var(--fm-border);
        color: var(--fm-text);
    }

    .fm-badge-pill .ic {
        width: 13px;
        height: 13px;
    }

    .fm-badge-pill.pill-lead {
        background: rgba(8, 124, 240, .22);
        border-color: rgba(30, 165, 255, .5);
        color: #fff;
        font-weight: 800;
    }

    .fm-badge-pill.pill-subtle {
        color: var(--fm-text-secondary);
        font-weight: 500;
    }

    .fm-badge-pill.pill-accent {
        background: rgba(8, 124, 240, .18);
        border-color: rgba(30, 165, 255, .4);
        color: var(--fm-cyan);
        text-decoration: none;
        transition: all .15s;
    }

    .fm-badge-pill.pill-accent:hover {
        background: rgba(8, 124, 240, .32);
        color: #fff;
    }

    /* 2. Live Broadcast Alert Strip */
    .fm-sport-live-strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: linear-gradient(90deg, rgba(22, 217, 104, .14), rgba(8, 124, 240, .12));
        border: 1px solid rgba(22, 217, 104, .45);
        border-radius: var(--fm-radius-md);
        padding: 10px 18px;
        flex-wrap: wrap;
        box-shadow: 0 4px 20px rgba(22, 217, 104, .08);
    }

    .live-strip-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .live-pulse-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: .1em;
        color: var(--fm-success);
        background: rgba(22, 217, 104, .2);
        padding: 3px 9px;
        border-radius: 4px;
    }

    .pulse-dot {
        width: 7px;
        height: 7px;
        background: var(--fm-success);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--fm-success);
        animation: pulseSport 1.5s infinite;
    }

    @keyframes pulseSport {
        0% {
            transform: scale(.95);
            opacity: .8;
        }

        50% {
            transform: scale(1.25);
            opacity: 1;
        }

        100% {
            transform: scale(.95);
            opacity: .8;
        }
    }

    .live-strip-title {
        display: flex;
        flex-direction: column;
        gap: 1px;
    }

    .live-strip-title strong {
        font-size: 14.5px;
        color: #fff;
    }

    .live-strip-title span {
        font-size: 12px;
        color: var(--fm-text-secondary);
    }

    .live-strip-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* 3. Compact Sports Telemetry HUD */
    .fm-telemetry-hud {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    @media (max-width: 960px) {
        .fm-telemetry-hud {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 520px) {
        .fm-telemetry-hud {
            grid-template-columns: 1fr;
        }
    }

    .hud-tile {
        background: var(--fm-surface);
        border: 1px solid var(--fm-border);
        border-radius: var(--fm-radius-md);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: border-color .14s, transform .14s;
    }

    .hud-tile:hover {
        border-color: var(--fm-border-active);
        transform: translateY(-1px);
    }

    .hud-tile-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .hud-k {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--fm-text-muted);
    }

    .hud-badge {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .04em;
        padding: 2px 6px;
        border-radius: 4px;
    }

    .hud-badge.cyan {
        background: rgba(24, 213, 255, .15);
        color: var(--fm-cyan);
    }

    .hud-badge.emerald {
        background: rgba(22, 217, 104, .15);
        color: var(--fm-success);
    }

    .hud-badge.blue {
        background: rgba(8, 124, 240, .15);
        color: var(--fm-primary-light);
    }

    .hud-badge.amber {
        background: rgba(255, 181, 38, .15);
        color: var(--fm-warning);
    }

    .hud-val {
        font-family: var(--fm-display);
        font-weight: 800;
        font-size: 24px;
        color: #fff;
        line-height: 1;
        letter-spacing: .02em;
    }

    .hud-val small {
        font-size: 13px;
        font-weight: 600;
        color: var(--fm-text-secondary);
    }

    .hud-bar-wrap {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, .08);
        border-radius: 999px;
        overflow: hidden;
    }

    .hud-bar-fill {
        height: 100%;
        background: var(--fm-cyan);
        border-radius: 999px;
    }

    .hud-bar-fill.emerald {
        background: var(--fm-success);
    }

    .hud-sub-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11.5px;
        color: var(--fm-text-secondary);
    }

    .hud-roles-mini {
        font-size: 10.5px;
        color: var(--fm-text-muted);
    }

    .hud-roles-mini b {
        color: #fff;
        margin-right: 4px;
    }

    .hud-foot-txt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11.5px;
        color: var(--fm-text-secondary);
        margin-top: 2px;
    }

    .hud-status-ok {
        color: var(--fm-success);
        font-weight: 600;
        font-size: 11px;
    }

    /* 4. Main Sports 2-Column Grid */
    .fm-sport-main-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: 14px;
        align-items: start;
    }

    @media (max-width: 1040px) {
        .fm-sport-main-grid {
            grid-template-columns: minmax(0, 1fr);
        }
    }

    .fm-sport-col-left,
    .fm-sport-col-right {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* Sports Cards */
    .fm-sport-card {
        background: var(--fm-card);
        border: 1px solid var(--fm-border);
        border-radius: var(--fm-radius-md);
        padding: 14px 16px;
        box-shadow: 0 4px 18px rgba(0, 6, 18, .25);
    }

    .sport-card-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--fm-border);
    }

    .sport-card-title {
        font-family: var(--fm-display);
        font-weight: 800;
        font-size: 18px;
        color: #fff;
        margin: 0;
        letter-spacing: .02em;
    }

    .sport-card-sub {
        font-size: 12px;
        color: var(--fm-text-muted);
        margin-top: 2px;
    }

    .sport-card-tag {
        font-size: 10.5px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--fm-primary-light);
        background: rgba(8, 124, 240, .14);
        padding: 2px 7px;
        border-radius: 4px;
    }

    /* Sports Standings & Budget Table */
    .sport-table-wrap {
        overflow-x: auto;
    }

    .sport-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
    }

    .sport-table th {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--fm-text-muted);
        padding: 6px 8px;
        border-bottom: 1px solid var(--fm-border);
        white-space: nowrap;
    }

    .sport-table td {
        padding: 7px 8px;
        border-bottom: 1px solid rgba(85, 160, 230, .08);
        vertical-align: middle;
    }

    .sport-table tr:hover td {
        background: rgba(8, 124, 240, .06);
    }

    .col-rank {
        font-family: var(--fm-display);
        font-weight: 800;
        font-size: 14px;
        color: var(--fm-text-muted);
        text-align: center;
    }

    .sport-team-cell {
        display: flex;
        align-items: center;
        gap: 9px;
    }

    .sport-team-avatar {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: rgba(8, 124, 240, .2);
        color: var(--fm-cyan);
        font-weight: 800;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .sport-team-names {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .sport-team-names .t-name {
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sport-team-names .t-owner {
        font-size: 11px;
        color: var(--fm-text-muted);
    }

    .sport-cred {
        font-family: var(--fm-display);
        font-weight: 800;
        font-size: 16px;
        color: var(--fm-success);
        line-height: 1;
    }

    .sport-cred.is-warn {
        color: var(--fm-warning);
    }

    .sport-cred.is-danger {
        color: var(--fm-danger);
    }

    .sport-cred small {
        font-size: 10px;
        font-weight: 600;
        color: var(--fm-text-muted);
    }

    .sport-roster-meter {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .meter-bar {
        flex: 1;
        height: 5px;
        background: rgba(255, 255, 255, .08);
        border-radius: 999px;
        overflow: hidden;
    }

    .meter-fill {
        height: 100%;
        background: var(--fm-cyan);
        border-radius: 999px;
    }

    .meter-text {
        font-family: var(--fm-display);
        font-weight: 700;
        font-size: 12.5px;
        color: var(--fm-text-secondary);
        width: 44px;
        text-align: right;
    }

    /* Sports Auction Rows */
    .sport-auctions-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .sport-auction-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        background: rgba(3, 15, 32, .5);
        border: 1px solid var(--fm-border);
        border-radius: var(--fm-radius-sm);
        transition: border-color .12s;
    }

    .sport-auction-row.is-live {
        border-color: rgba(22, 217, 104, .45);
        background: rgba(22, 217, 104, .06);
    }

    .sport-auction-row.is-paused {
        border-color: rgba(255, 181, 38, .45);
    }

    .row-status {
        flex-shrink: 0;
    }

    .row-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
    }

    .row-info strong {
        font-size: 13.5px;
        color: #fff;
    }

    .row-info span {
        font-size: 11.5px;
        color: var(--fm-text-secondary);
    }

    .row-actions {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    /* Operational Tools Grid */
    .sport-tools-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    @media (max-width: 600px) {
        .sport-tools-grid {
            grid-template-columns: 1fr;
        }
    }

    .sport-tool-tile {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        background: rgba(3, 15, 32, .6);
        border: 1px solid var(--fm-border);
        border-radius: var(--fm-radius-sm);
        text-decoration: none;
        color: var(--fm-text);
        transition: all .14s;
    }

    .sport-tool-tile:hover {
        border-color: var(--fm-border-active);
        background: rgba(8, 124, 240, .12);
        color: #fff;
        transform: translateY(-1px);
    }

    .sport-tool-tile.is-btn {
        width: 100%;
        text-align: left;
        cursor: pointer;
        font-family: inherit;
    }

    .tool-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 15px;
    }

    .tool-icon.icon-cyan {
        background: rgba(24, 213, 255, .14);
        color: var(--fm-cyan);
    }

    .tool-icon.icon-emerald {
        background: rgba(22, 217, 104, .14);
        color: var(--fm-success);
    }

    .tool-icon.icon-blue {
        background: rgba(8, 124, 240, .14);
        color: var(--fm-primary-light);
    }

    .tool-icon.icon-amber {
        background: rgba(255, 181, 38, .14);
        color: var(--fm-warning);
    }

    .tool-icon.icon-purple {
        background: rgba(168, 85, 247, .14);
        color: #c084fc;
    }

    .tool-icon.icon-subtle {
        background: rgba(255, 255, 255, .06);
        color: var(--fm-text-secondary);
    }

    .tool-icon .ic {
        width: 16px;
        height: 16px;
    }

    .tool-content {
        flex: 1;
        min-width: 0;
    }

    .tool-title {
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        line-height: 1.2;
    }

    .tool-desc {
        font-size: 11px;
        color: var(--fm-text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Recent Deals Feed */
    .sport-deals-feed {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .deal-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        background: rgba(3, 15, 32, .5);
        border: 1px solid rgba(85, 160, 230, .10);
        border-radius: var(--fm-radius-sm);
    }

    .deal-role {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--fm-display);
        font-weight: 800;
        font-size: 12px;
        flex-shrink: 0;
        color: #fff;
    }

    .role-P {
        background: #f97316;
    }

    .role-D {
        background: #22c55e;
    }

    .role-C {
        background: #3b82f6;
    }

    .role-A {
        background: #ef4444;
    }

    .deal-player {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .deal-name {
        font-weight: 700;
        font-size: 12.5px;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .deal-winner {
        font-size: 11px;
        color: var(--fm-text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .deal-winner .ic {
        width: 11px;
        height: 11px;
    }

    .deal-price {
        font-family: var(--fm-display);
        font-weight: 800;
        font-size: 16px;
        color: var(--fm-cyan);
        flex-shrink: 0;
    }

    .deal-price small {
        font-size: 10px;
        font-weight: 600;
        color: var(--fm-text-muted);
    }

    /* Multi-Tenant Hub Cards */
    .fm-hub-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
    }

    .fm-hub-card {
        background: var(--fm-card);
        border: 1px solid var(--fm-border);
        border-radius: var(--fm-radius-md);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: border-color .14s, transform .14s, box-shadow .14s;
    }

    .fm-hub-card:hover {
        border-color: var(--fm-border-active);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 6, 18, .35);
    }

    .fm-hub-card.is-live {
        border-color: rgba(22, 217, 104, .45);
        background: linear-gradient(145deg, rgba(22, 217, 104, .08), rgba(4, 20, 41, .98));
    }

    .hub-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .hub-mode-pill {
        font-size: 10.5px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, .06);
        color: var(--fm-text-secondary);
    }

    .hub-mode-pill.is-live {
        background: rgba(22, 217, 104, .18);
        color: var(--fm-success);
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }

    .live-dot {
        width: 6px;
        height: 6px;
        background: var(--fm-success);
        border-radius: 50%;
    }

    .hub-id {
        font-size: 11px;
        font-family: var(--fm-display);
        color: var(--fm-text-muted);
    }

    .hub-name {
        font-family: var(--fm-display);
        font-weight: 800;
        font-size: 18px;
        color: #fff;
        margin: 0 0 3px;
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .hub-name .ic {
        width: 16px;
        height: 16px;
        color: var(--fm-primary-light);
    }

    .hub-sub {
        font-size: 11.5px;
        color: var(--fm-text-muted);
        margin-bottom: 8px;
    }

    .hub-metrics {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11.5px;
        background: rgba(3, 15, 32, .5);
        padding: 6px 10px;
        border-radius: var(--fm-radius-sm);
        border: 1px solid rgba(85, 160, 230, .1);
    }

    .hub-metric {
        display: flex;
        gap: 4px;
    }

    .hub-metric .k {
        color: var(--fm-text-muted);
    }

    .hub-metric .v {
        color: #fff;
        font-weight: 700;
    }

    .hub-live-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;

    .fm-chip-teamname {

        height: 48px;

        font-weight: 800;
        font-size: 18px;
        color: #fff;

    .fm-team-cockpit-avatar img {

        height: 100%;

    .fm-team-cockpit-title {

    .fm-role-tag {

    }

    .fm-role-tag.role-D {
        background: #059669;
    }

    .fm-role-tag.role-C {
        background: #2563eb;
    }

    .fm-role-tag.role-A {
        background: #dc2626;

    .fm-player-name {

        color: #fff;

    .fm-player-team {
        font-size: 10px;
        font-weight: 700;

    .fm-player-right {

    }

        font-weight: 800;
        font-size: 13.5px;
        color: var(--fm-accent);

    .fm-player-fvm {

        color: var(--fm-text-muted);

        background: rgba(255, 255, 255, .015);

        cursor: pointer;

        gap: 16px;

    .fm-all-rose-card {

        border-radius: var(--fm-radius-md);

        flex-direction: column;

        font-weight: 700;

    .fm-mini-player-pill {

        border: 1px solid rgba(255, 255, 255, .05);

        color: #fff;
    }

    .fm-mini-player-pill small {
        color: var(--fm-accent);
    }

    .fm-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(2, 8, 20, .8);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 16px;
        animation: fmModalIn .15s ease;
    }

    @keyframes fmModalIn {
        from {
            opacity: 0;
            transform: scale(.97);
        }

        to {
            opacity: 1;
            transform: none;
        }
    }

    .fm-modal-dialog {
        background: linear-gradient(135deg, rgba(7, 29, 56, .98) 0%, rgba(4, 18, 38, .98) 100%);
        border: 1px solid var(--fm-border);
        border-radius: var(--fm-radius-md);
        box-shadow: 0 16px 40px rgba(0, 0, 0, .6);
        width: 100%;
        max-width: 520px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .fm-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid var(--fm-border);

        font-family: var(--fm-display);
        font-weight: 800;
        font-size: 17px;
        color: #fff;
        margin: 0;
    }

        background: none;
        border: none;
        color: var(--fm-text-muted);

        padding: 0;

        overflow-y: auto;

        justify-content: flex-end;

        background: rgba(3, 15, 32, .5);

        flex-direction: column;

    .fm-form-select:focus {

        box-shadow: 0 0 8px rgba(8, 124, 240, .3);

        inset: 0;
        z-index: 1000;
        background: rgba(2, 8, 20, .75);
        backdrop-filter: blur(8px);

            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

        background: var(--fm-surface);

        color: #fff;
