version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: fantamanager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fantamanager}
      POSTGRES_USER: ${POSTGRES_USER:-fantamanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fantamanager_secret_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fantamanager} -d ${POSTGRES_DB:-fantamanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${DOCKER_IMAGE:-ghcr.io/brividich/fantamanager:latest}
    container_name: fantamanager
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Di default solo da questa macchina: davanti c'è il reverse proxy, che
      # porta l'HTTPS. Su Synology: Pannello di controllo → Portale di accesso →
      # Avanzate → Proxy inverso, da https://il-tuo-dominio a
      # http://localhost:8088 (vedi SYNOLOGY_NAS.md). Solo in LAN, senza proxy:
      # FM_BIND=0.0.0.0 nel .env e DJANGO_BEHIND_PROXY=False.
      - "${FM_BIND:-127.0.0.1}:${PORT:-8088}:8000"
    environment:
      # Vuota = l'entrypoint ne genera una e la conserva in ./data/.secret_key.
      # Mai un valore scritto in questo file: il repository e' pubblico.
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      # Maxischermo e link squadra solo con il loro token (False = LAN fidata).
      - PUBLIC_TOKENS_REQUIRED=${PUBLIC_TOKENS_REQUIRED:-True}
      # Primo superadmin (facoltativo). Senza, la password viene generata e
      # stampata una volta sola nel log del container.
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
      # Obbligatoria: i nomi da cui si apre l'app, separati da virgola
      # (es. fanta.example.it,192.168.1.10). Mai «*».
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:?imposta DJANGO_ALLOWED_HOSTS nel file .env}
      # True SOLO dietro il reverse proxy, con la porta su 127.0.0.1: fidarsi di
      # X-Forwarded-For con la porta aperta lascia a chiunque scriverlo (e
      # aggirare il limite dei tentativi su login, reset e codici squadra).
      - DJANGO_BEHIND_PROXY=${DJANGO_BEHIND_PROXY:-False}
      # L'indirizzo pubblico https dell'installazione: da qui partono i link
      # delle email (reset password, inviti) ed entra fra le origini CSRF.
      - FM_SITE_URL=${FM_SITE_URL:-}
      - DJANGO_SECURE_SSL_REDIRECT=False
      - POSTGRES_DB=${POSTGRES_DB:-fantamanager}
      - POSTGRES_USER=${POSTGRES_USER:-fantamanager}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fantamanager_secret_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - FANTAMANAGER_MEDIA_ROOT=/app/media
      - DJANGO_STATIC_ROOT=/app/staticfiles
      # Chiave API-Football (giocatori usciti dalla Serie A): va messa nel file .env
      - APIFOOTBALL_KEY=${APIFOOTBALL_KEY:-}
      # Statistiche di stagione tue (facoltative), per esempio in ./data: vedi .env
      - FANTAMANAGER_STATS_FILE=${FANTAMANAGER_STATS_FILE:-}
      - FANTAMANAGER_STATS_SEASON=${FANTAMANAGER_STATS_SEASON:-}
      # Privacy (docs/PRIVACY.md): titolare e contatto nell'informativa, conservazione.
      - FM_PRIVACY_OWNER=${FM_PRIVACY_OWNER:-}
      - FM_PRIVACY_EMAIL=${FM_PRIVACY_EMAIL:-}
      - FM_RETENTION_BID_IP_DAYS=${FM_RETENTION_BID_IP_DAYS:-90}
      - FM_RETENTION_UNVERIFIED_DAYS=${FM_RETENTION_UNVERIFIED_DAYS:-30}
      - BACKUP_KEEP=${BACKUP_KEEP:-30}
      - BACKUP_EVERY_HOURS=${BACKUP_EVERY_HOURS:-6}
      # Altre origini da cui arrivano i form, oltre a FM_SITE_URL (niente «*»).
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      # /healthz/ risponde 503 se il database non risponde.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Scheduler: chiude i lotti dell'asta anche senza nessuno collegato, apre e
  # chiude le sessioni di mercato alle loro date e blocca le formazioni alla
  # scadenza della giornata. Stessa immagine e stesso database dell'app.
  scheduler:
    container_name: fantamanager-scheduler
    # La stessa immagine e lo stesso tag dell'app (DOCKER_IMAGE): mai due
    # versioni del codice sullo stesso database.
    image: ${DOCKER_IMAGE:-ghcr.io/brividich/fantamanager:latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost}
      - FM_SITE_URL=${FM_SITE_URL:-}
      - POSTGRES_DB=${POSTGRES_DB:-fantamanager}
      - POSTGRES_USER=${POSTGRES_USER:-fantamanager}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fantamanager_secret_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - APIFOOTBALL_KEY=${APIFOOTBALL_KEY:-}
      # La pulizia della privacy di ogni giorno (docs/PRIVACY.md).
      - FM_RETENTION_BID_IP_DAYS=${FM_RETENTION_BID_IP_DAYS:-90}
      - FM_RETENTION_UNVERIFIED_DAYS=${FM_RETENTION_UNVERIFIED_DAYS:-30}
      # Niente migrazioni, superadmin o static: li fa il container dell'app.
      - FM_SCHEDULER_ONLY=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "manage.py", "run_scheduler"]
    healthcheck:
      disable: true

  # Backup del database: pg_dump della stessa versione del server, all'avvio,
  # ogni BACKUP_EVERY_HOURS ore e entro un minuto da quando l'app lo chiede
  # (fine asta). File pg-AAAAMMGG-HHMMSS.sql.gz (ora UTC) in ./backups; tiene i
  # BACKUP_KEEP piu' recenti. Ripristino: vedi README, "Backup e ripristino".
  backup:
    image: postgres:16-alpine
    container_name: fantamanager-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-fantamanager}
      PGUSER: ${POSTGRES_USER:-fantamanager}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fantamanager_secret_pass}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        every=$$((BACKUP_EVERY_HOURS * 3600)); last=0
        echo "backup: ogni $$BACKUP_EVERY_HOURS ore, tengo gli ultimi $$BACKUP_KEEP"
        while true; do
          now=$$(date +%s)
          if [ -f /backups/.richiesta ] || [ $$((now - last)) -ge "$$every" ]; then
            rm -f /backups/.richiesta
            f=/backups/pg-$$(date -u +%Y%m%d-%H%M%S)
            if pg_dump --clean --if-exists --no-owner --file="$$f.part" && mv "$$f.part" "$$f.sql" && gzip "$$f.sql"; then
              last=$$now
              echo "backup: $$f.sql.gz"
              ls -1t /backups/pg-*.sql.gz | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
            else
              rm -f "$$f.part" "$$f.sql"
              echo "backup: pg_dump non riuscito, riprovo tra 10 minuti" >&2
              sleep 540
            fi
          fi
          sleep 60
        done

  watchtower:
    image: containrrr/watchtower:latest
    container_name: fantamanager-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: fantamanager

volumes:
  postgres_data:
