name: Tests

# Every pull request, and every push to main, runs the whole Django suite.
# A red check here means the change broke something that used to work.
on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # same as the Docker image
          cache: pip

      - name: Install dependencies
        # pystray is the desktop tray icon: it needs a GUI toolkit a CI runner
        # does not have, and no test imports it.
        run: |
          grep -v '^pystray' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install --upgrade pip
          pip install -r /tmp/requirements-ci.txt

      - name: Collect static files
        # WhiteNoise serves hashed files from a manifest: without it every page
        # that references a static file fails to render, in tests too.
        env:
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}
        run: python manage.py collectstatic --noinput

      - name: Run tests
        # Production-like settings: DEBUG off, which also requires a real key.
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}
        run: python manage.py test --noinput

  django-postgres:
    # The Docker deployment runs on PostgreSQL 16, not SQLite: the same suite
    # against the real thing, so a query only Postgres rejects shows up here.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fantamanager
          POSTGRES_USER: fantamanager
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantamanager -d fantamanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}
      POSTGRES_DB: fantamanager
      POSTGRES_USER: fantamanager
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          grep -v '^pystray' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install --upgrade pip
          pip install -r /tmp/requirements-ci.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests on PostgreSQL
        env:
          DJANGO_DEBUG: "False"
        run: python manage.py test --noinput
